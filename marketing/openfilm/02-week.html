<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css"><div class="brand">relay<b>.</b></div><main id="content"><div class="copy"><div class="tag">Plan the week</div><h2>Give every task<br>a place and owner.</h2><p>Calendar, status, and an<br>Up next queue.</p><span class="badge">Working calendar prototype</span></div><div class="visual"><img class="shot" src="assets/desktop.jpg"></div></main><div class="line"><span id="progress"></span></div><div class="note">Synthetic demo · Built with OpenFilm</div><script>window.film={duration:5,ready:Promise.all(Array.from(document.images,i=>i.decode())),frame(t){const u=Math.max(0,Math.min(1,t/.6));document.getElementById('content').style.opacity=u;document.getElementById('content').style.transform='translateY('+((1-u)*18)+'px)';document.getElementById('progress').style.transform='scaleX('+Math.max(0,Math.min(1,t/5))+')';}};</script>
