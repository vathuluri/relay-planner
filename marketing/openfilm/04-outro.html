<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="style.css"><div class="brand">relay<b>.</b></div><main id="content"><div class="hero"><div class="tag">Building in public</div><h2>Start with a clear plan.<br>Time tracking comes next.</h2><p>Explore the prototype, code, and roadmap.</p><div class="pill">github.com/vathuluri/relay-planner</div><p class="fine">Time entries and timesheets are planned, not implemented.</p></div></main><div class="line"><span id="progress"></span></div><div class="note">Synthetic demo · Built with OpenFilm</div><script>window.film={duration:5,ready:Promise.all(Array.from(document.images,i=>i.decode())),frame(t){const u=Math.max(0,Math.min(1,t/.6));document.getElementById('content').style.opacity=u;document.getElementById('content').style.transform='translateY('+((1-u)*18)+'px)';document.getElementById('progress').style.transform='scaleX('+Math.max(0,Math.min(1,t/5))+')';}};</script>
