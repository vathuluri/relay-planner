[build]
  command = "npm run build:netlify"
  publish = "dist"
[build.environment]
  NODE_VERSION = "24"
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-store"
